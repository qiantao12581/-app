name: Build TrollStore IPA

on:
  workflow_dispatch:
  push:
    branches:
      - master
      - "codex/**"

permissions:
  contents: read

concurrency:
  group: trollstore-ipa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core-tests:
    name: Fast core tests
    runs-on: macos-15
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Run catalog builder tests
        shell: bash
        run: python3 -m unittest scripts.catalog.test_catalog_builder -v

      - name: Enforce exact 500-food release gate
        shell: bash
        run: python3 scripts/catalog/catalog_builder.py --check-release

      - name: Run Swift core tests
        shell: bash
        run: swift test

  build:
    name: Test and package unsigned IPA
    needs: core-tests
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Select newest installed stable Xcode
        shell: bash
        run: |
          set -euo pipefail
          XCODE_APP=$(python3 - <<'PY'
          import pathlib
          import re

          candidates = []
          for path in pathlib.Path("/Applications").glob("Xcode_*.app"):
              match = re.fullmatch(r"Xcode_(\d+(?:\.\d+)*)\.app", path.name)
              if match:
                  version = tuple(int(part) for part in match.group(1).split("."))
                  candidates.append((version, path))

          if not candidates:
              raise SystemExit("No stable Xcode installation was found")

          print(max(candidates, key=lambda item: item[0])[1])
          PY
          )
          sudo xcode-select --switch "$XCODE_APP/Contents/Developer"
          xcodebuild -version
          xcodebuild -showsdks

      - name: Build app and tests
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild \
            -project NutritionTracker.xcodeproj \
            -scheme NutritionTracker \
            -destination "generic/platform=iOS Simulator" \
            -derivedDataPath "$RUNNER_TEMP/TestDerivedData" \
            build-for-testing

      - name: Prepare iOS simulator
        shell: bash
        run: |
          set -euo pipefail
          SIMULATOR_INFO=$(xcrun simctl list devices available -j | python3 -c '
          import json, re, sys
          runtimes = json.load(sys.stdin)["devices"]
          candidates = []
          for runtime, devices in runtimes.items():
              match = re.search(r"iOS-(\d+)-(\d+)", runtime)
              if not match:
                  continue
              version = tuple(map(int, match.groups()))
              for device in devices:
                  if device.get("isAvailable") and device["name"].startswith("iPhone"):
                      pro_priority = 1 if "Pro" in device["name"] else 0
                      candidates.append((version, pro_priority, device["name"], runtime, device["udid"]))
          if not candidates:
              raise SystemExit("No available iPhone simulator was found")
          selected = max(candidates)
          print("|".join((selected[4], selected[2], selected[3])))
          ')
          IFS='|' read -r SIMULATOR_ID SIMULATOR_NAME SIMULATOR_RUNTIME <<< "$SIMULATOR_INFO"
          echo "Selected simulator: $SIMULATOR_NAME ($SIMULATOR_RUNTIME) $SIMULATOR_ID"
          xcrun simctl boot "$SIMULATOR_ID" 2>&1 || true
          python3 - "$SIMULATOR_ID" <<'PY'
          import subprocess
          import sys

          subprocess.run(
              ["xcrun", "simctl", "bootstatus", sys.argv[1], "-b"],
              check=True,
              timeout=180,
          )
          PY
          xcrun simctl list devices | grep "$SIMULATOR_ID"
          echo "SIMULATOR_ID=$SIMULATOR_ID" >> "$GITHUB_ENV"

      - name: Run unit tests
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild \
            -project NutritionTracker.xcodeproj \
            -scheme NutritionTracker \
            -destination "platform=iOS Simulator,id=$SIMULATOR_ID" \
            -derivedDataPath "$RUNNER_TEMP/TestDerivedData" \
            -parallel-testing-enabled NO \
            test-without-building

      - name: Build TrollStore IPA
        shell: bash
        run: bash scripts/build-trollstore-ipa.sh

      - name: Upload IPA
        uses: actions/upload-artifact@v7
        with:
          name: NutritionTracker-TrollStore
          path: artifacts/NutritionTracker-TrollStore.ipa
          if-no-files-found: error
          retention-days: 30

      - name: Upload build information
        uses: actions/upload-artifact@v7
        with:
          name: NutritionTracker-build-info
          path: artifacts/build-info.txt
          if-no-files-found: error
          retention-days: 30
